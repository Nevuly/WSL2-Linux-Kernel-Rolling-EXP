name: Experimental Kernel CI

on:
  push:
    tags:
      - 'linux-wsl-exp-[0-9]+-6.12.[0-9]+'

run-name: Experimental Build ${{ github.ref_name }}

jobs:
  call-core-workflow:
    name: Experimental Kernel Build
    uses: Nevuly/WSL2-Linux-Kernel-Rolling-EXP/.github/workflows/build.yml@master
    with:
      tag_name: ${{ github.ref_name }}
      build_type: current
      build_rt: true
      build_zfs: true
      is_release: ${{ github.event_name != 'pull_request' }}
    secrets: inherit
